services:
  postgres:
    image: postgres:16-alpine
    container_name: semana16-postgres
    environment:
      POSTGRES_DB: semana16
      POSTGRES_USER: semana16
      POSTGRES_PASSWORD: semana16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semana16 -d semana16"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: semana16-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/semana16
      SPRING_DATASOURCE_USERNAME: semana16
      SPRING_DATASOURCE_PASSWORD: semana16
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: semana16-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
