<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos - Semana 16</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="header">
        <div>
          <p class="eyebrow">SEMANA16</p>
          <h1>Cadastro de pedidos</h1>
        </div>
        <button id="reloadButton" type="button">Atualizar</button>
      </section>

      <section class="workspace">
        <form id="pedidoForm" class="panel">
          <input id="pedidoId" type="hidden" />

          <div class="form-header">
            <h2 id="formTitle">Novo pedido</h2>
            <button id="cancelButton" class="ghost hidden" type="button">Cancelar edicao</button>
          </div>

          <label>
            Cliente
            <input id="cliente" name="cliente" type="text" placeholder="Nome do cliente" required />
          </label>

          <label>
            Produto
            <input id="produto" name="produto" type="text" placeholder="Produto pedido" required />
          </label>

          <div class="grid">
            <label>
              Quantidade
              <input id="quantidade" name="quantidade" type="number" min="1" step="1" required />
            </label>

            <label>
              Valor
              <input id="valor" name="valor" type="number" min="0" step="0.01" required />
            </label>
          </div>

          <label>
            Status
            <select id="status" name="status">
              <option value="pendente">Pendente</option>
              <option value="pago">Pago</option>
              <option value="enviado">Enviado</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </label>

          <button id="submitButton" type="submit">Salvar pedido</button>
          <p id="message" class="message" role="status"></p>
        </form>

        <section class="panel list-panel">
          <div class="form-header">
            <h2>Pedidos cadastrados</h2>
            <span id="counter" class="counter">0 pedidos</span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Produto</th>
                  <th>Qtd.</th>
                  <th>Valor</th>
                  <th>Status</th>
                  <th>Acoes</th>
                </tr>
              </thead>
              <tbody id="pedidosBody">
                <tr>
                  <td colspan="6">Carregando pedidos...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
